services:
  postgres:
    image: postgres:16
    container_name: radar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar123
      POSTGRES_DB: radar_eleitoral
    ports:
      - "5433:5432"
    volumes:
      - radar_postgres_data:/var/lib/postgresql/data

volumes:
  radar_postgres_data:
