services:
  postgres:
    image: postgres:16
    container_name: radar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
      POSTGRES_DB: radar_eleitoral
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - radar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar_eleitoral"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  radar_postgres_data:
