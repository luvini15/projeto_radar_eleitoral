name: Security checks
on:
  push:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npm ci && npm audit --audit-level=moderate
        working-directory: radar-eleitoral
      - run: python -m pip install -r backend/requirements.txt pip-audit
      - run: python -m pip_audit -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -t backend
        env:
          DATABASE_URL: sqlite://
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./migration-ci.db
